name: Deploy to Cloud Run

# Manual only, from main, behind the `production` environment (configure
# required reviewers on it). Nothing deploys on push.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          AIS_RELAY_URL: ${{ vars.AIS_RELAY_URL }}
          OPENSKY_RELAY_URL: ${{ vars.OPENSKY_RELAY_URL }}
          FEEDBACK_ADMIN_EMAILS: ${{ vars.FEEDBACK_ADMIN_EMAILS }}
        run: bash deploy/cloudrun.sh
