name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: git ls-files '*.mjs' | xargs -n1 node --check
      - run: npm ci
      - name: Unit tests
        run: npm test

  # P0 browser gate. Runs the legacy UI (and, from P3 on, the React surfaces) against the loopback
  # fixture server with every third-party request routed to pinned local copies.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build fixtures
        run: npm run fixtures:build
      - name: Synthesized fixtures are current
        run: git diff --exit-code -- test/fixtures/synthesized
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
