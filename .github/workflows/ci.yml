name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The unit suite has known failures (stale expectations), so it is not a
      # gate yet. Every module must at least parse.
      - name: Syntax check
        run: git ls-files '*.mjs' | xargs -n1 node --check
