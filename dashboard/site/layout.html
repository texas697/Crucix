<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOC_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="apple-touch-icon" href="/brand/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020408;--panel:rgba(6,14,22,0.82);--border:rgba(100,240,200,0.12);--text:#e8f4f0;--body:#c4d6d0;--dim:#6a8a82;--accent:#64f0c8;--accent2:#44ccff;--mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.65;padding:32px 16px 64px}
main{max-width:760px;margin:0 auto}
.brand{text-decoration:none;font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--accent);text-transform:uppercase}
h1{color:var(--text);font-size:28px;font-weight:600;line-height:1.25;margin:12px 0 6px}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:28px}
h2{color:var(--text);font-size:18px;font-weight:600;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--border)}
h3{color:var(--text);font-size:15px;font-weight:600;margin:20px 0 6px}
p,ul,ol,table{margin:0 0 12px}
ul,ol{padding-left:22px}
li{margin:4px 0}
strong{color:var(--text)}
a{color:var(--accent2)}
.caps{text-transform:uppercase;font-size:13px}
.toc{background:var(--panel);border:1px solid var(--border);padding:14px 18px;margin-bottom:8px}
.toc ol{margin:0}
table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border:1px solid var(--border)}
th{color:var(--text);font-weight:600;background:var(--panel)}
.lead{font-size:18px;line-height:1.6;color:var(--text);margin:4px 0 22px}
.card{background:var(--panel);border:1px solid var(--border);padding:16px 18px;margin:0 0 12px}
.card h3{margin-top:0}
.card p:last-child{margin-bottom:0}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:22px 0 8px}
.features .card{margin:0}
.stores{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}
.store{display:inline-block;padding:11px 18px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.store:hover{background:rgba(100,240,200,0.1)}
.soon{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details{border:1px solid var(--border);background:var(--panel);padding:10px 14px;margin:0 0 8px}
summary{cursor:pointer;color:var(--text);font-weight:600}
details p{margin:8px 0 2px}
.fine{font-size:12px;color:var(--dim);margin-top:26px}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--dim)}
footer a{margin-right:14px}
@media print{body{background:#fff;color:#000}h1,h2,h3,strong,th{color:#000}a{color:#000}.toc,th,.card,details{background:none}}
</style>
</head>
<body>
<main>
<a class="brand" href="/mfb-think-tank">{{APP_NAME}}</a>
<h1>{{TITLE}}</h1>
{{META}}
{{BODY}}
<footer>
  <a href="/mfb-think-tank">{{APP_NAME}}</a><a href="/support">Support</a><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="/privacy#delete-account">Delete your account</a>
  <div style="margin-top:8px">© {{YEAR}} {{OPERATOR}}</div>
</footer>
</main>
</body>
</html>
