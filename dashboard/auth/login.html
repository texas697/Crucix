<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUCIX — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020408;--panel:rgba(6,14,22,0.82);--border:rgba(100,240,200,0.12);--border-bright:rgba(100,240,200,0.3);--text:#e8f4f0;--dim:#6a8a82;--accent:#64f0c8;--accent2:#44ccff;--warn:#ffb84c;--danger:#ff5f63;--mono:'IBM Plex Mono',monospace;--sans:'Space Grotesk',sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(100,240,200,0.06),transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(68,204,255,0.06),transparent 50%)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);padding:28px 26px;backdrop-filter:blur(10px)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--accent);text-transform:uppercase}
.brand .blink{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:8px;animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.2}}
h1{font-size:22px;font-weight:600;margin:14px 0 4px}
.sub{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:22px}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 11px;outline:none}
input:focus{border-color:var(--border-bright)}
button{cursor:pointer;font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase;font-size:11px;font-weight:600}
.primary{width:100%;margin-top:18px;padding:12px;background:rgba(100,240,200,0.12);border:1px solid var(--border-bright);color:var(--accent)}
.primary:hover{background:rgba(100,240,200,0.2)}
.primary:disabled{opacity:0.5;cursor:wait}
.link{background:none;border:none;color:var(--accent2);padding:0;text-transform:none;letter-spacing:0;font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--dim);gap:12px;flex-wrap:wrap}
.msg{margin-top:14px;font-family:var(--mono);font-size:11px;line-height:1.5;min-height:16px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--accent)}
.foot{margin-top:22px;font-size:10px;color:var(--dim);line-height:1.5;border-top:1px solid var(--border);padding-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="blink"></span>Crucix Monitor</div>
  <h1 id="title">Sign in</h1>
  <div class="sub" id="sub">Access to this intelligence terminal requires an account.</div>
  <form id="form" autocomplete="on">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required minlength="8" autocomplete="current-password" placeholder="••••••••••••">
    <button class="primary" id="submit" type="submit">Sign in</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="row">
    <button class="link" id="toggle" type="button">Need an account? Create one</button>
    <button class="link" id="reset" type="button">Forgot password</button>
  </div>
  <div class="foot">Your own LLM API key can be added after sign-in and is stored encrypted. Keys are only used to generate your trade ideas.</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const CFG = window.__FIREBASE_CONFIG__ || null;
const ALLOW_SIGNUP = window.__ALLOW_SIGNUP__ !== false;
const $ = id => document.getElementById(id);
const msg = (text, cls) => { const m = $('msg'); m.textContent = text || ''; m.className = 'msg ' + (cls || ''); };
let mode = 'signin';
const params = new URLSearchParams(location.search);
const nextUrl = (() => { const n = params.get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();

if (!CFG) { msg('Server is missing FIREBASE_WEB_CONFIG — auth cannot start.', 'err'); $('submit').disabled = true; }
else firebase.initializeApp(CFG);

if (!ALLOW_SIGNUP) $('toggle').style.display = 'none';
if (params.get('reason') === 'expired') msg('Session expired — please sign in again.', 'err');

function setMode(m) {
  mode = m;
  $('title').textContent = m === 'signup' ? 'Create account' : 'Sign in';
  $('submit').textContent = m === 'signup' ? 'Create account' : 'Sign in';
  $('toggle').textContent = m === 'signup' ? 'Already have an account? Sign in' : 'Need an account? Create one';
  $('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
  msg('');
}
$('toggle').onclick = () => setMode(mode === 'signup' ? 'signin' : 'signup');

$('reset').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return msg('Enter your email first, then click Forgot password.', 'err');
  try { await firebase.auth().sendPasswordResetEmail(email); msg('Password reset email sent.', 'ok'); }
  catch (e) { msg(friendly(e), 'err'); }
};

function friendly(e) {
  const c = e?.code || '';
  if (c.includes('user-not-found') || c.includes('wrong-password') || c.includes('invalid-credential')) return 'Invalid email or password.';
  if (c.includes('email-already-in-use')) return 'That email already has an account — sign in instead.';
  if (c.includes('weak-password')) return 'Password must be at least 8 characters.';
  if (c.includes('too-many-requests')) return 'Too many attempts — wait a minute and retry.';
  if (c.includes('operation-not-allowed')) return 'Email/password sign-in is not enabled in Firebase.';
  return e?.message || 'Sign-in failed.';
}

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const email = $('email').value.trim(), password = $('password').value;
  $('submit').disabled = true; msg('Authenticating…');
  try {
    const cred = mode === 'signup'
      ? await firebase.auth().createUserWithEmailAndPassword(email, password)
      : await firebase.auth().signInWithEmailAndPassword(email, password);
    const idToken = await cred.user.getIdToken(true);
    const r = await fetch('/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idToken }) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `Server rejected session (${r.status})`);
    await firebase.auth().signOut(); // the httpOnly cookie is the session from here on
    msg('Access granted — loading terminal…', 'ok');
    location.replace(nextUrl);
  } catch (e) {
    msg(friendly(e), 'err');
    $('submit').disabled = false;
  }
};
</script>
</body>
</html>
